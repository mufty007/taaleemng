; Queue worker for Ta'aleem: student imports and invitation emails run here.
; deploy/setup-server.sh fills in __APP_DIR__ and __APP_USER__ and installs it as
; /etc/supervisor/conf.d/taaleem.conf. deploy/deploy.sh restarts it after each update.

[program:taaleem-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work database --sleep=3 --tries=3 --timeout=300 --max-time=3600
directory=__APP_DIR__
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=310
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
