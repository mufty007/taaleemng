# Nginx site for Ta'aleem. deploy/setup-server.sh fills in __DOMAIN__, __APP_DIR__ and
# __PHP_VERSION__ and installs it as /etc/nginx/sites-available/taaleem; certbot then
# adds the HTTPS server block and the redirect from http.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    # Receipts and classwork uploads go up to 10 MB.
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite's hashed assets never change, so browsers can keep them for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.png { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # No other PHP file and no dotfile (.env, .git) is ever served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
